name: Release

# Push a tag like v0.3.0 and this builds Blink for Apple Silicon and Intel, then publishes
# Blink.zip on a GitHub Release. scripts/install.sh always installs the latest one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode (for the Liquid Glass look)
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Test
        run: swift test

      - name: Build universal app
        run: |
          echo "${GITHUB_REF_NAME#v}" > VERSION
          UNIVERSAL=1 scripts/build-app.sh
          ditto -c -k --keepParent build/Blink.app Blink.zip
          shasum -a 256 Blink.zip | tee Blink.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Blink.zip Blink.zip.sha256 \
            --title "Blink ${GITHUB_REF_NAME#v}" \
            --notes "Install or update with one line in Terminal:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh
          \`\`\`

          Or download **Blink.zip**, unzip it, and move Blink to Applications (see the README for the one-time \"Open Anyway\" step)."
